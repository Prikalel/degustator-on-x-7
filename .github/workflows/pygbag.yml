
name: pygbag_build
on: [workflow_dispatch]


jobs:
  build-pygbag:
    name: Build for Emscripten pygbag runtime
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v2
    - name: Checkout
      run: |
            python -m pip install pygbag
            python -m pygbag --build $GITHUB_WORKSPACE/main.py
    - name: Enable cross-reload progress (localStorage sync)
      # Injects a tiny script into the built index.html so finished-company
      # progress survives page reloads (the MEMFS save file is mirrored to
      # browser localStorage). See tools/enable_web_save.py.
      run: python tools/enable_web_save.py build/web/index.html
    - name : "Upload to GitHub pages branch gh-pages"
      uses: JamesIves/github-pages-deploy-action@4.1.7
      with:
        branch: gh-pages
        folder: build/web
